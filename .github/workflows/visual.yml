name: Manuscript visual acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/self-host-fonts.mjs
      - run: npm test && npm run build
      - run: npm install --prefix /tmp/evidraft-visual playwright@1.56.1
      - run: |
          cp docs/reference-v2.html dist/
          python3 -m http.server 4173 --directory dist >/tmp/evidraft-server.log 2>&1 &
          cp scripts/visual-acceptance.mjs /tmp/evidraft-visual/
          node /tmp/evidraft-visual/visual-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-acceptance
          path: screenshots/
